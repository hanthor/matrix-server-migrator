apiVersion: v1
kind: ConfigMap
metadata: {name: vm-scrape, namespace: monitoring}
data:
  scrape.yaml: |
    global:
      scrape_interval: 15s
    scrape_configs:
    # Spindle's Prometheus endpoint (port name "metrics") in the ESS namespace.
    - job_name: spindle
      kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [ess]}
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: spindle
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    # Container CPU/memory/restarts from each kubelet's cAdvisor, via the API server proxy.
    - job_name: cadvisor
      scheme: https
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
      kubernetes_sd_configs: [{role: node}]
      relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      metric_relabel_configs:
      - source_labels: [namespace]
        regex: ess|postgres|monitoring|spindle-rehearsal
        action: keep
    # Kubelet itself (pod restarts, probe results via prober metrics).
    - job_name: kubelet
      scheme: https
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
      kubernetes_sd_configs: [{role: node}]
      relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/probes
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      metric_relabel_configs:
      - source_labels: [namespace]
        regex: ess
        action: keep
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: vm-data, namespace: monitoring}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: victoriametrics, namespace: monitoring}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: victoriametrics}}
  template:
    metadata: {labels: {app: victoriametrics}}
    spec:
      serviceAccountName: victoriametrics
      nodeSelector: {kubernetes.io/hostname: ip-10-20-1-12}
      securityContext: {runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: vm
        image: victoriametrics/victoria-metrics:v1.102.1
        args: [-storageDataPath=/data, -retentionPeriod=90d, -promscrape.config=/config/scrape.yaml, -httpListenAddr=:8428]
        ports: [{name: http, containerPort: 8428}]
        readinessProbe: {httpGet: {path: /health, port: http}}
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
        securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: data, mountPath: /data}, {name: config, mountPath: /config}]
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: vm-data}}
      - {name: config, configMap: {name: vm-scrape}}
---
apiVersion: v1
kind: Service
metadata: {name: victoriametrics, namespace: monitoring}
spec:
  selector: {app: victoriametrics}
  ports: [{name: http, port: 8428, targetPort: http}]
