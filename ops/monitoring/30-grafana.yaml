apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: monitoring}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: VictoriaMetrics
      uid: victoriametrics
      type: prometheus
      url: http://victoriametrics.monitoring.svc:8428
      isDefault: true
      jsonData: {timeInterval: 15s}
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring.svc:3200
      jsonData:
        serviceMap: {datasourceUid: victoriametrics}
        nodeGraph: {enabled: true}
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: spindle
      folder: Spindle
      type: file
      options: {path: /var/lib/grafana/dashboards}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grafana-data, namespace: monitoring}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: monitoring}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      nodeSelector: {kubernetes.io/hostname: ip-10-20-1-12}
      securityContext: {runAsUser: 472, runAsGroup: 472, fsGroup: 472, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: grafana
        image: grafana/grafana:11.3.0
        ports: [{name: http, containerPort: 3000}]
        env:
        - {name: GF_SECURITY_ADMIN_USER, value: admin}
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}
        - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
        - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
        - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
        - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/spindle-dashboard.json}
        readinessProbe: {httpGet: {path: /api/health, port: http}}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: data, mountPath: /var/lib/grafana}
        - {name: prov-datasources, mountPath: /etc/grafana/provisioning/datasources}
        - {name: prov-dashboards, mountPath: /etc/grafana/provisioning/dashboards}
        - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: grafana-data}}
      - {name: prov-datasources, configMap: {name: grafana-provisioning, items: [{key: datasources.yaml, path: datasources.yaml}]}}
      - {name: prov-dashboards, configMap: {name: grafana-provisioning, items: [{key: dashboards.yaml, path: dashboards.yaml}]}}
      - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: monitoring}
spec:
  selector: {app: grafana}
  ports: [{name: http, port: 80, targetPort: http}]
---
# Tailnet-only: reachable at https://spindle-grafana.<tailnet>.ts.net, never public.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: grafana, namespace: monitoring}
spec:
  ingressClassName: tailscale
  defaultBackend: {service: {name: grafana, port: {number: 80}}}
  tls: [{hosts: [spindle-grafana]}]
